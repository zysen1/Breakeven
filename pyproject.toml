[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakeven"
version = "0.1.0"
description = "Shadow-replay a deployment, qualify the cheapest oversight policy that meets a reliability target, and compute the fully loaded human-cost breakeven."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "zysen1" }]
keywords = ["agents", "evaluation", "forward-deployed-engineering", "reliability"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "jinja2>=3.1",
  "httpx>=0.27",
  "altair>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
breakeven = "breakeven.cli:main"

[project.urls]
Homepage = "https://github.com/zysen1/breakeven"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
breakeven = ["templates/*.j2", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
